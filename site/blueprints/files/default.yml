title: Bild

fields:
    alt:
        label: Alt-Text (Bildbeschreibung)
        type: text
        help: Beschreibt in einem kurzen Satz, was auf dem Bild zu sehen ist – für Menschen, die das Bild nicht sehen können (Screenreader) oder wenn es nicht lädt. Z. B. „Raumansicht mit drei großformatigen Gemälden in Rot- und Blautönen“. Nicht mit „Bild von …“ beginnen, keine Fotocredits. Bei Logos den Namen der Institution eintragen.
    credit:
        label: Credits
        type: textarea
        buttons: false
        help: Werkangaben und Fotocredits, eine Angabe pro Zeile. Erscheinen in der Bildunterschrift.
        width: 2/3
    canBeCoupled:
        label: Darf neben einem anderen Bild stehen
        type: toggle
        default: true
        help: Nur für Ausstellungsgalerien. Zwei aufeinanderfolgende Hochformate werden nebeneinander gezeigt, wenn beide dies erlauben.
        translate: false
        width: 1/3
    linkurl:
        label: Link (nur bei Logos)
        type: url
        help: Webseite der Institution. Das Logo wird dann dorthin verlinkt.
        translate: false

# Scale down large uploads, so the originals stay small and thumbs generate fast
create:
    width: 2500
    height: 2500
    quality: 85
