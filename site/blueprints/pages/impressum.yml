title: Impressum
icon: info

options:
    changeTemplate: false
    delete: false

tabs:
    infos:
        label: Inhalt
        icon: text
        fields:
            color:
                label: Farbe
                type: color
                help: Hintergrund der Seite Impressum.
                translate: false
                width: 1/3
            colorGap:
                type: gap
                width: 2/3
            impressum:
                label: Impressum
                type: writer
                nodes:
                    - paragraph
                    - bulletList
                width: 1/2
            datenschutz:
                label: Datenschutz
                type: writer
                nodes:
                    - paragraph
                    - bulletList
                width: 1/2
            foerderungHeadline:
                label: Förderung
                type: headline
            foerderungtext:
                label: Überschrift der Förderer
                type: text
                placeholder: z. B. „Der Kunstverein Heilbronn wird institutionell gefördert von:“
                width: 1/2
            foerderunglogos:
                label: Logos der Förderer
                type: files
                layout: cards
                size: small
                help: Reihenfolge wie auf der Website. Bitte bei jedem Logo den Namen der Institution als Alt-Text eintragen (auf das Logo klicken).
                width: 1/2
                translate: false
                uploads:
                    template: logo
