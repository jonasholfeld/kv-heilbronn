title: Katalog
icon: book

tabs:
    content:
        label: Inhalt
        fields:
            color:
                label: Farbe
                type: color
                translate: false
                width: 1/4
            wordpressId:
                label: WordPress-ID
                type: text
                width: 1/4
            kuenstler:
                label: Künstler:in
                type: text
                width: 3/4
            beschreibung:
                label: Beschreibung
                type: writer
                size: large
    media:
        label: Medien
        fields:
            galerie:
                label: Galerie
                type: files
                store: id
                layout: cards
                size: medium
            bildAltText:
                label: Alt-Text
                type: text
                width: 1/3
            bildCaption:
                label: Bild-Caption
                type: text
                width: 1/3
            bildBeschreibung:
                label: Bildbeschreibung
                type: text
                width: 1/3
    import:
        label: Import
        fields:
            legacyBildquellen:
                label: Ursprüngliche Bildreferenzen
                type: textarea
                buttons: false
    bestellung:
        label: Bestellung
        icon: cart
        fields:
            preise:
                label: Preisoptionen
                type: structure
