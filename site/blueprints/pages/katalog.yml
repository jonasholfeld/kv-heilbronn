title: Katalog
icon: book

create:
    fields:
        - kuenstler

tabs:
    content:
        label: Inhalt
        icon: text
        columns:
            main:
                width: 2/3
                fields:
                    kuenstler:
                        label: Künstler:in
                        type: text
                        translate: false
                    beschreibung:
                        label: Beschreibung
                        type: writer
                        nodes:
                            - paragraph
                            - bulletList
                        size: large
                        help: Angaben wie Herausgeber, Umfang, Format und ISBN.
            sidebar:
                width: 1/3
                fields:
                    color:
                        label: Farbe
                        type: color
                        help: Hintergrund der Shop-Seite und Farbe der Karte im Shop und auf der Startseite.
                        translate: false
                    # Only from the WordPress import, not shown on the website
                    wordpressId:
                        type: hidden
                    bildAltText:
                        type: hidden
                    bildCaption:
                        type: hidden
                    bildBeschreibung:
                        type: hidden
                    legacyBildquellen:
                        type: hidden

    media:
        label: Medien
        icon: image
        fields:
            galerie:
                label: Galerie
                type: files
                store: id
                layout: cards
                size: medium
                help: Das erste Bild erscheint im Shop und auf der Startseite. Bitte bei jedem Bild Alt-Text und Credits ausfüllen (auf das Bild klicken).
                translate: false
                uploads:
                    template: default

    bestellung:
        label: Bestellung
        icon: cart
        fields:
            preise:
                label: Preisoptionen
                type: structure
                help: Erscheinen im Bestellformular als Auswahl, z. B. „25 Euro zzgl. Versand“. Ohne Preisoptionen entfällt die Preisauswahl.
                fields:
                    label:
                        label: Bezeichnung
                        type: text
                        required: true
