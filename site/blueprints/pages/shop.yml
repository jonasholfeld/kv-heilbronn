title: Shop
icon: cart

options:
    changeTemplate: false
    delete: false

tabs:
    shop:
        sections:
            kataloge:
                type: pages
                label: Kataloge
                templates:
                    - katalog
                status: all
                limit: 10
                width: 1/2
            editionen:
                type: pages
                label: Editionen
                templates:
                    - edition
                status: all
                limit: 10
                width: 1/2
    formular:
        label: Bestellformular
        icon: email
        columns:
            felder:
                width: 2/3
                sections:
                    formularFelder:
                        type: fields
                        fields:
                            formular:
                                extends: fields/formular
                                help: Gilt für alle Shop-Einträge. Bilder, Beschreibung und Preise kommen aus dem jeweiligen Shop-Eintrag.
                                fieldsets:
                                    - form-editions
                                    - form-prices
                                    - form-group
                                    - form-text
                                    - form-textarea
                                    - form-choice
                                    - form-consent
                                    - form-upload
                                    - form-info
                                    - form-spacer
            einstellungen:
                width: 1/3
                sections:
                    formularEinstellungen:
                        type: fields
                        fields:
                            formularEinstellungen: fields/formular-einstellungen
