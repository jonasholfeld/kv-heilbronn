title: Shop
icon: cart

options:
    changeTemplate: false
    delete: false

tabs:
    shop:
        sections:
            kataloge:
                type: pages
                label: Kataloge
                templates:
                    - katalog
                status: all
                limit: 10
                width: 1/2
            editionen:
                type: pages
                label: Editionen
                templates:
                    - edition
                status: all
                limit: 10
                width: 1/2
    # Editions and catalogues have forms of their own, see site/plugins/kv-forms.
    # The catalogue form's fields are prefixed with `katalog`.
    formular:
        label: Bestellformular Editionen
        icon: email
        columns:
            felder:
                width: 2/3
                sections:
                    formularFelder:
                        type: fields
                        fields:
                            formular:
                                extends: fields/formular
                                help: Gilt für alle Editionen. Bilder, Beschreibung und Preise kommen aus dem jeweiligen Shop-Eintrag.
                                fieldsets:
                                    - form-editions
                                    - form-prices
                                    - form-group
                                    - form-text
                                    - form-textarea
                                    - form-choice
                                    - form-consent
                                    - form-upload
                                    - form-info
                                    - form-spacer
            einstellungen:
                width: 1/3
                sections:
                    formularEinstellungen:
                        type: fields
                        fields:
                            formularEinstellungen: fields/formular-einstellungen
    katalogFormular:
        label: Bestellformular Kataloge
        icon: book
        columns:
            katalogFelder:
                width: 2/3
                sections:
                    katalogFormularFelder:
                        type: fields
                        fields:
                            katalogFormular:
                                extends: fields/formular
                                help: Gilt für alle Kataloge. Beschreibung und Preise kommen aus dem jeweiligen Shop-Eintrag.
                                fieldsets:
                                    - form-prices
                                    - form-group
                                    - form-text
                                    - form-textarea
                                    - form-choice
                                    - form-consent
                                    - form-upload
                                    - form-info
                                    - form-spacer
            katalogEinstellungen:
                width: 1/3
                sections:
                    katalogFormularEinstellungen:
                        type: fields
                        fields:
                            katalogFormularEinstellungen: fields/formular-einstellungen-katalog
