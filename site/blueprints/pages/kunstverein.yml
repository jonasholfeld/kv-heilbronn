title: Kunstverein


tabs:
    content:
        label: Inhalt
        fields:
            color:
                label: Farbe
                type: color
                translate: false
                width: 1/2
            gallery:
                label: Galerie
                type: files
                width: 1/2
            searchpreview:
                label: Vorschautext in der Suche
                type: textarea
                buttons: false
                maxlength: 200
                help: Erscheint im Suchergebnis dieser Seite. Leer gelassen steht dort der Anfang der Textblöcke.
            blockseditor:
                label: Textblöcke
                type: blocks
                fieldsets:
                    - text
                    - file
            satzungpdf:
                translate: false
                label: Satzung PDF
                type: files
                multiple: false
                width: 1/2
    formular:
        label: Mitgliedsantrag
        icon: email
        columns:
            felder:
                width: 2/3
                sections:
                    formularFelder:
                        type: fields
                        fields:
                            formular: fields/formular
            einstellungen:
                width: 1/3
                sections:
                    formularEinstellungen:
                        type: fields
                        fields:
                            formularEinstellungen: fields/formular-einstellungen
