title: Reise
icon: globe

create:
    fields:
        - category
        - reiseStart

tabs:
    content:
        label: Inhalt
        icon: text
        fields:
            category:
                label: Kategorie
                type: select
                required: true
                help: Bestimmt die Farbe (siehe Seite Reisen).
                translate: false
                width: 1/3
                options:
                    kunstreise: Kunstreise
                    atelierbesuch: Atelierbesuch
            reiseStart:
                label: Reisebeginn
                type: date
                display: DD.MM.YYYY
                required: true
                help: Das Anmeldeformular ist bis zum Vortag geöffnet.
                translate: false
                width: 1/3
            reiseEnde:
                label: Reiseende
                type: date
                display: DD.MM.YYYY
                help: Nur bei mehrtägigen Reisen. Erscheint in den Suchergebnissen.
                translate: false
                width: 1/3
            beschreibung:
                label: Beschreibung
                type: writer
                nodes:
                    - paragraph
                    - bulletList
                size: large
            reiseplan:
                label: Reiseplan
                type: writer
                nodes:
                    - paragraph
                    - bulletList
                help: Optional, z. B. Treffpunkt, Ablauf und Programm.
            anmeldung:
                label: Anmeldung
                type: writer
                nodes:
                    - paragraph
                    - bulletList
                help: Optional, z. B. Preis und Anmeldeschluss. Erscheint auf der Reiseseite und oben im Anmeldeformular (die Formularfelder werden auf der Seite Reisen gepflegt).
            # Only from the WordPress import, not shown on the website
            wordpressId:
                type: hidden
            veroeffentlichtAm:
                type: hidden
            reiseDatumText:
                type: hidden
            legacyBildquellen:
                type: hidden

    media:
        label: Medien
        icon: image
        fields:
            galerie:
                label: Galerie
                type: files
                store: id
                layout: cards
                size: medium
                help: Bitte bei jedem Bild Alt-Text und Credits ausfüllen (auf das Bild klicken).
                translate: false
                uploads:
                    template: default
