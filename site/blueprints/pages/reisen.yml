title: Reisen
icon: globe

options:
    changeTemplate: false
    delete: false

tabs:
    reisen:
        label: Reisen
        icon: globe
        sections:
            fields:
                type: fields
                fields:
                    color:
                        label: Farbe der Seite
                        type: color
                        help: Hintergrund der Seite Reisen und der Reisen-Box auf der Startseite.
                        translate: false
                        width: 1/3
                    kunstreisecolor:
                        label: Farbe Kunstreisen
                        type: color
                        help: Für Reisen der Kategorie Kunstreise (Karten, Reiseseite, Termine).
                        translate: false
                        width: 1/3
                    atelierbesuchcolor:
                        label: Farbe Atelierbesuche
                        type: color
                        help: Für Reisen der Kategorie Atelierbesuch (Karten, Reiseseite, Termine).
                        translate: false
                        width: 1/3
            drafts:
                type: pages
                label: Entwürfe
                help: Entwürfe sind auf der Website nicht sichtbar.
                status: draft
                sortBy: reiseStart desc
                layout: table
                templates:
                    - reise
                columns:
                    category:
                        label: Kategorie
                        type: text
                        value: '{{ page.categoryLabel }}'
                        width: 1/6
                    reisestart:
                        label: Beginn
                        type: date
                        display: DD.MM.YYYY
                        width: 1/6
            published:
                type: pages
                label: Veröffentlicht
                status: published
                sortBy: reiseStart desc
                layout: table
                limit: 25
                search: true
                templates:
                    - reise
                columns:
                    category:
                        label: Kategorie
                        type: text
                        value: '{{ page.categoryLabel }}'
                        width: 1/6
                    reisestart:
                        label: Beginn
                        type: date
                        display: DD.MM.YYYY
                        width: 1/6
    formular:
        label: Anmeldeformular
        icon: email
        columns:
            felder:
                width: 2/3
                sections:
                    formularFelder:
                        type: fields
                        fields:
                            formular:
                                extends: fields/formular
                                help: Gilt für alle kommenden Reisen. Titel, Datum und der Text „Anmeldung“ kommen aus der jeweiligen Reise.
            einstellungen:
                width: 1/3
                sections:
                    formularEinstellungen:
                        type: fields
                        fields:
                            formularEinstellungen: fields/formular-einstellungen
