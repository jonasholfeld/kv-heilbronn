name: Textfeld
icon: input-cursor-move
label: '{{ label }}'
preview: fields
wysiwyg: true

fields:
    label:
        type: text
        label: Bezeichnung
        help: Steht als Platzhalter im Feld.
        required: true
        width: 1/2
    fieldtype:
        type: select
        label: Art
        default: text
        required: true
        width: 1/4
        help: Das erste Feld „E-Mail“ erhält die Bestätigungs-E-Mail; das Feld „Name“ füllt den Platzhalter {name}.
        options:
            text: Text
            name: Name
            email: E-Mail
            tel: Telefon
            date: Datum
            number: Anzahl
            iban: IBAN
            bic: BIC
    width:
        extends: fields/formular-breite
        width: 1/4
    required:
        type: toggle
        label: Pflichtfeld
        width: 1/2
    minAge:
        type: number
        label: Mindestalter
        help: Optional, z. B. 18 für eine Volljährigkeitsprüfung beim Geburtsdatum.
        min: 0
        width: 1/2
        when:
            fieldtype: date
