name: Menü-Gruppe
icon: list-bullet
label: '{{ title }}'
wysiwyg: true

fields:
    title:
        type: text
        label: Überschrift der Gruppe
        required: true
        width: 1/2
    linktitle:
        type: text
        label: Link der Überschrift
        placeholder: z. B. /ausstellungen
        help: Optional. Ohne Link führt die Überschrift zum ersten Eintrag der Gruppe.
        width: 1/2
    entries:
        type: blocks
        label: Einträge
        fieldsets:
            - menuentry
