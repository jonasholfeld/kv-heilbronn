name: Menü-Eintrag
icon: url
label: '{{ label }}'

fields:
    label:
        type: text
        label: Bezeichnung
        required: true
        width: 1/2
    linkType:
        type: toggle
        label: Ziel
        width: 1/2
        text:
            - Seite der Website
            - Adresse (Anker oder extern)
    page:
        type: pages
        label: Seite
        max: 1
        when:
            linkType: false
    url:
        type: text
        label: Adresse
        placeholder: z. B. /kunstverein#team oder https://www.beispiel.de
        help: Ein Anker (#…) muss in einem Textblock der Zielseite gesetzt sein.
        when:
            linkType: true
