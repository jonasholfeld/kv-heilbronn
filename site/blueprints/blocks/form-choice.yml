name: Auswahl
icon: toggle-on
label: '{{ label }}'
preview: fields
wysiwyg: true

fields:
    label:
        type: text
        label: Bezeichnung (für die E-Mail)
        required: true
        width: 1/2
    width:
        extends: fields/formular-breite
        width: 1/4
    stacked:
        type: toggle
        label: Untereinander
        width: 1/4
    required:
        type: toggle
        label: Pflichtfeld
        width: 1/2
    preselect:
        type: toggle
        label: Erste Option vorauswählen
        width: 1/2
    options:
        type: tags
        label: Optionen
        # Options like "Schülerin, Studentin (…)" contain commas
        separator: ;
        help: Es kann genau eine Option gewählt werden.
        required: true
