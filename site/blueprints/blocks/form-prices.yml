name: Preisauswahl
icon: money
label: '{{ label }}'
preview: fields
wysiwyg: true

fields:
    info:
        type: info
        text: Zeigt die Preisoptionen des jeweiligen Shop-Eintrags (Tab „Bestellung“ im Shop-Eintrag). Ohne Preisoptionen wird der Bereich ausgeblendet.
    label:
        type: text
        label: Bezeichnung (für die E-Mail)
        default: Preis
        width: 1/3
    required:
        type: toggle
        label: Pflichtfeld
        width: 1/3
    preselect:
        type: toggle
        label: Erste Option vorauswählen
        default: true
        width: 1/3
